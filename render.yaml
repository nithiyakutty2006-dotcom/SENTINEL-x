services:
  - type: web
    name: sentinel-x
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.12
      - key: SENTINEL_MONITORING_MODE
        value: demo
